<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Task List</h1>
        <nav>
            <a href="#tarefas">Minhas tarefas</a>
        </nav>
    </header>

    <main class="container" id="tarefas">
        <section class="task-box" aria-labelledby="titulo-tarefas">
            <h2 id="titulo-tarefas">Minha lista de tarefas</h2>
            <p class="task-subtitle">Organize suas tarefas do dia</p>

            <form class="task-form" id="taskForm" novalidate>
                <div class="form-control">
                    <label class="sr-only" for="taskInput">Nova tarefa</label>
                    <input 
                        type="text" 
                        id="taskInput"
                        name="task"
                        placeholder="Digite uma nova tarefa"
                        maxlength="120"
                        autocomplete="off"
                        required
                    >
                    <small id="inputError" class="input-error" aria-live="polite"></small>
                </div>

                <button type="submit" id="addTaskBtn">
                    <span class="btn-text">Adicionar</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>

            <div class="filter-area" aria-label="Filtrar tarefas">
                <button type="button" class="filter-btn active" data-filter="todas" aria-pressed="true">
                    Todas
                </button>
                <button type="button" class="filter-btn" data-filter="pendentes" aria-pressed="false">
                    Pendentes
                </button>
                <button type="button" class="filter-btn" data-filter="concluidas" aria-pressed="false">
                    Concluídas
                </button>
            </div>

            <ul id="taskList" aria-live="polite"></ul>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 - Task List desenvolvida com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
