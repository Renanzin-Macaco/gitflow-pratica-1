<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Task List</h1>
        <nav>
            <a href="#tarefas">Minhas tarefas</a>
        </nav>
    </header>

    <main class="container" id="tarefas">
        <section class="task-box">
            <h2>Minha lista de tarefas</h2>
            <p>Organize suas tarefas do dia</p>

            <div class="input-area">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Digite uma nova tarefa"
                >
                <button id="addTaskBtn">Adicionar</button>
            </div>

            <ul id="taskList"></ul>
        </section>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 - Task List desenvolvida com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
